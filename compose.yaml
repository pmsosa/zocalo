services:
  zocalo:
    build: .
    image: zocalo:latest
    container_name: zocalo
    restart: unless-stopped
    ports:
      - "${ZOCALO_PORT:-8730}:8000"
    environment:
      ZOCALO_AUTH: "${ZOCALO_AUTH:-accounts}"
      ZOCALO_DATASETS_HOST: "${ZOCALO_DATASETS_DIR:-./datasets}"
    volumes:
      - "${ZOCALO_DATA_DIR:-./data}:/data"
      - "${ZOCALO_DATASETS_DIR:-./datasets}:/datasets"
