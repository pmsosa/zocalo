<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zócalo · logo options</title>
<link rel="icon" href="logos/zocalo-logo-3-speech-square.png">
<style>
body{margin:0;background:#efefe4;color:#181818;font:400 14px/1.5 Inter,system-ui,sans-serif;padding:40px 48px}
h1{font:300 40px/1.05 Manrope,system-ui,sans-serif;letter-spacing:-.03em;margin:0 0 6px} h1 span{color:#83837e}
p.lead{color:#666;margin:0 0 32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
figure{margin:0;background:#fcfcf9;border:1px solid #d7d7d6;border-radius:8px;padding:20px}
.big{height:200px;display:grid;place-items:center} .big img{max-width:180px;max-height:180px}
.sizes{display:flex;gap:10px;align-items:center;margin:16px 0 12px}
.sizes span{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:4px}
.cream{background:#efefe4} .dark{background:#222} .tab{background:#e3e3e3;font-size:12px;gap:6px!important}
figcaption{color:#666;font-size:13px} figcaption b{display:block;color:#181818;font-weight:500}
.lock{margin-top:16px;background:#fcfcf9;border:1px solid #d7d7d6;border-radius:8px;padding:28px;display:flex;gap:48px;align-items:center;flex-wrap:wrap}
.lock img{height:90px} .lock .sm{height:28px}
</style></head><body>
<h1>Zócalo.<br><span>Six logo options.</span></h1>
<p class="lead">Each shown large, at 32 and 16 px on cream and dark, and in a browser tab. Option 3 also has a lockup with the name.</p>
<div class="grid"><figure><div class="big"><img src="logos/zocalo-logo-1-dot-sphere.png" alt="Dot sphere"></div>
<div class="sizes"><span class="cream"><img src="logos/zocalo-logo-1-dot-sphere.png" width="32"><img src="logos/zocalo-logo-1-dot-sphere.png" width="16"></span><span class="dark"><img src="logos/zocalo-logo-1-dot-sphere.png" width="32"><img src="logos/zocalo-logo-1-dot-sphere.png" width="16"></span><span class="tab"><img src="logos/zocalo-logo-1-dot-sphere.png" width="16">Zócalo</span></div>
<figcaption><b>1 · Dot sphere</b>A globe of square dots with a blue patch. Weakest at favicon size.</figcaption></figure><figure><div class="big"><img src="logos/zocalo-logo-2-pixel-z.png" alt="Pixel Z"></div>
<div class="sizes"><span class="cream"><img src="logos/zocalo-logo-2-pixel-z.png" width="32"><img src="logos/zocalo-logo-2-pixel-z.png" width="16"></span><span class="dark"><img src="logos/zocalo-logo-2-pixel-z.png" width="32"><img src="logos/zocalo-logo-2-pixel-z.png" width="16"></span><span class="tab"><img src="logos/zocalo-logo-2-pixel-z.png" width="16">Zócalo</span></div>
<figcaption><b>2 · Pixel Z</b>A Z on a 5×5 grid of square dots, blue centre. Strong at 16 px.</figcaption></figure><figure><div class="big"><img src="logos/zocalo-logo-3-speech-square.png" alt="Speech square"></div>
<div class="sizes"><span class="cream"><img src="logos/zocalo-logo-3-speech-square.png" width="32"><img src="logos/zocalo-logo-3-speech-square.png" width="16"></span><span class="dark"><img src="logos/zocalo-logo-3-speech-square.png" width="32"><img src="logos/zocalo-logo-3-speech-square.png" width="16"></span><span class="tab"><img src="logos/zocalo-logo-3-speech-square.png" width="16">Zócalo</span></div>
<figcaption><b>3 · Speech square</b>A square speech bubble holding a 3×3 dot grid, blue centre. Most solid at 16 px.</figcaption></figure><figure><div class="big"><img src="logos/zocalo-logo-4-sunflower.png" alt="Sunflower"></div>
<div class="sizes"><span class="cream"><img src="logos/zocalo-logo-4-sunflower.png" width="32"><img src="logos/zocalo-logo-4-sunflower.png" width="16"></span><span class="dark"><img src="logos/zocalo-logo-4-sunflower.png" width="32"><img src="logos/zocalo-logo-4-sunflower.png" width="16"></span><span class="tab"><img src="logos/zocalo-logo-4-sunflower.png" width="16">Zócalo</span></div>
<figcaption><b>4 · Sunflower</b>A radial burst of dots around a blue centre, like the answer clusters. Soft when small.</figcaption></figure><figure><div class="big"><img src="logos/zocalo-logo-5-plaza.png" alt="Plaza"></div>
<div class="sizes"><span class="cream"><img src="logos/zocalo-logo-5-plaza.png" width="32"><img src="logos/zocalo-logo-5-plaza.png" width="16"></span><span class="dark"><img src="logos/zocalo-logo-5-plaza.png" width="32"><img src="logos/zocalo-logo-5-plaza.png" width="16"></span><span class="tab"><img src="logos/zocalo-logo-5-plaza.png" width="16">Zócalo</span></div>
<figcaption><b>5 · Plaza</b>The square from above: a framed grid of dots with a blue heart. Good at 16 px.</figcaption></figure><figure><div class="big"><img src="logos/zocalo-logo-6-two-clusters.png" alt="Two clusters"></div>
<div class="sizes"><span class="cream"><img src="logos/zocalo-logo-6-two-clusters.png" width="32"><img src="logos/zocalo-logo-6-two-clusters.png" width="16"></span><span class="dark"><img src="logos/zocalo-logo-6-two-clusters.png" width="32"><img src="logos/zocalo-logo-6-two-clusters.png" width="16"></span><span class="tab"><img src="logos/zocalo-logo-6-two-clusters.png" width="16">Zócalo</span></div>
<figcaption><b>6 · Two clusters</b>A population split into two answers. Reads as “oo” when small.</figcaption></figure></div>
<div class="lock"><img src="logos/zocalo-logo-3-speech-square-lockup.png" alt="Speech square with the Zócalo wordmark"><img class="sm" src="logos/zocalo-logo-3-speech-square-lockup.png" alt=""></div>
</body></html>
